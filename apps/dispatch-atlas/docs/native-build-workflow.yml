# TEMPLATE ONLY. Copy to repository .github/workflows/dispatch-atlas-native.yml.
# Manual compilation/packaging; no release publication, store upload, or signing credentials.
name: Dispatch Atlas native build checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-atlas-native-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: apps/dispatch-atlas

jobs:
  apple:
    name: Apple simulator and unsigned Mac builds
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Copy web resources
        run: python3 platforms/copy-assets.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/dispatch-atlas/platforms/apple
        run: xcodegen generate
      - name: Build iOS simulator app
        working-directory: apps/dispatch-atlas/platforms/apple
        run: >-
          xcodebuild -project DispatchAtlas.xcodeproj -scheme DispatchAtlasIOS
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build tvOS simulator app
        working-directory: apps/dispatch-atlas/platforms/apple
        run: >-
          xcodebuild -project DispatchAtlas.xcodeproj -scheme DispatchAtlasTV
          -configuration Debug -sdk appletvsimulator
          -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath build-tv CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build unsigned native macOS app
        working-directory: apps/dispatch-atlas/platforms/apple
        run: >-
          xcodebuild -project DispatchAtlas.xcodeproj -scheme DispatchAtlasMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build-mac CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Archive app bundles preserving their structure
        working-directory: apps/dispatch-atlas/platforms/apple
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Debug-iphonesimulator/DispatchAtlasIOS.app artifacts/DispatchAtlas-iOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build-tv/Build/Products/Debug-appletvsimulator/DispatchAtlasTV.app artifacts/DispatchAtlas-tvOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build-mac/Build/Products/Debug/DispatchAtlasMac.app artifacts/DispatchAtlas-Mac-Unsigned.zip
      - name: Upload Apple build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-atlas-apple-unsigned
          path: apps/dispatch-atlas/platforms/apple/artifacts/*.zip
          retention-days: 14
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Copy web resources
        run: python3 platforms/copy-assets.py
      - name: Compile debug APK
        working-directory: apps/dispatch-atlas/platforms/android
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-atlas-android-debug
          path: apps/dispatch-atlas/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  desktop:
    name: Electron ${{ matrix.label }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-portable
            command: build:win
            output: '*.exe'
          - os: macos-15
            label: Mac-DMG-unsigned
            command: build:mac
            output: '*.dmg'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Copy web resources
        run: python platforms/copy-assets.py
      - name: Install Electron dependencies
        working-directory: apps/dispatch-atlas/platforms/desktop
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Package unsigned desktop app
        working-directory: apps/dispatch-atlas/platforms/desktop
        run: npm run '${{ matrix.command }}' -- --publish never
      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-atlas-${{ matrix.label }}
          path: apps/dispatch-atlas/platforms/desktop/release/${{ matrix.output }}
          retention-days: 14
          if-no-files-found: error
