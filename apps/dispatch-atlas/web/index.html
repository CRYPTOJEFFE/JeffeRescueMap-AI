<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1b33"><meta name="description" content="Dispatch Atlas — scanner audio, incident awareness, and station displays.">
<title>Dispatch Atlas</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<aside class="sidebar"><a href="#incidents" class="brand"><span class="brand-icon">⌁</span><span>DISPATCH <b>ATLAS</b><small>RADIO · INCIDENTS · AWARENESS</small></span></a><div class="nav-label">WORKSPACE</div><nav id="side-nav" aria-label="Primary"></nav><div class="sidebar-foot"><span class="online-dot"></span><span id="connection-side">Local workspace</span><small>Independent reconstruction<br>Built for your dispatch desk.</small></div></aside>
<div class="app-shell"><header class="topbar"><div><span class="eyebrow" id="section-caption">SITUATIONAL AWARENESS</span><h1 id="page-title">Incident dashboard</h1></div><div class="top-actions"><span class="connection-chip" id="connection">Offline capable</span><button class="icon-button" id="fullscreen" aria-label="Toggle full screen" title="Full screen">⛶</button><div class="avatar" title="Local workspace">JJ</div></div></header>
<div class="mode-banner" id="mode-banner" role="status"></div>
<main id="main" tabindex="-1"></main>
</div>
<section class="mini-player hidden" id="mini-player" aria-label="Audio player"><span class="radio-icon">◉</span><div class="player-copy"><strong id="player-title"></strong><small id="player-state" role="status">Ready</small></div><button id="player-prev" class="icon-button" aria-label="Previous call">⏮</button><button id="player-toggle" class="round-play" aria-label="Play or pause">▶</button><button id="player-next" class="icon-button" aria-label="Next call">⏭</button><label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label><button class="icon-button" id="player-close" aria-label="Close player">×</button></section>
<nav id="bottom-nav" class="bottom-nav" aria-label="Mobile navigation"></nav>
<dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" role="status" class="toast hidden"></div><audio id="audio" preload="none"></audio>
<input type="file" id="import-file" accept="application/json,.json" hidden><input type="file" id="geo-file" accept="application/json,.json,.geojson" hidden><input type="file" id="audio-file" accept="audio/*" hidden>
<script src="core.js"></script><script src="data.js"></script><script src="map.js"></script><script src="app.js"></script>
</body></html>
